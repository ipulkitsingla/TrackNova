<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle for PWA icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.3" />

  <!-- Speed lines in background -->
  <path d="M 40 180 L 180 180" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.25" />
  <path d="M 20 220 L 140 220" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.4" />
  <path d="M 60 260 L 160 260" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.3" />

  <!-- Train Body (High-speed bullet train / Vande Bharat aerodynamic profile) -->
  <g transform="translate(40, 20)">
    <!-- Aerodynamic Cabin / Shell -->
    <path d="M 120 280 
             L 280 280 
             C 380 280, 410 240, 420 210 
             C 425 195, 415 170, 370 160 
             L 240 145 
             L 120 145 
             Z" 
          fill="url(#trainGrad)" />

    <!-- Train Nose Windshield -->
    <path d="M 280 160 
             L 360 170 
             C 390 175, 400 195, 395 210 
             L 280 200 
             Z" 
          fill="#0f172a" />
    <!-- Glass reflection -->
    <path d="M 300 168 L 350 175 L 340 195 L 295 190 Z" fill="#38bdf8" opacity="0.6" />

    <!-- Side Passenger Windows -->
    <rect x="140" y="170" width="34" height="24" rx="4" fill="#0f172a" />
    <rect x="185" y="170" width="34" height="24" rx="4" fill="#0f172a" />
    <rect x="230" y="170" width="34" height="24" rx="4" fill="#0f172a" />

    <!-- Window Light glow -->
    <rect x="142" y="172" width="30" height="20" rx="3" fill="#38bdf8" opacity="0.8" />
    <rect x="187" y="172" width="30" height="20" rx="3" fill="#38bdf8" opacity="0.8" />
    <rect x="232" y="172" width="30" height="20" rx="3" fill="#38bdf8" opacity="0.8" />

    <!-- Aerodynamic Speed Accent Stripe -->
    <path d="M 120 220 L 415 220" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- Headlight Beam & Lamp -->
    <circle cx="410" cy="225" r="10" fill="#ffffff" filter="url(#glow)" />
    <polygon points="415,225 460,205 460,245" fill="#38bdf8" opacity="0.4" filter="url(#glow)" />

    <!-- Pantograph on top -->
    <path d="M 160 145 L 180 115 L 210 115 L 195 145" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linejoin="round" />
    <line x1="170" y1="115" x2="225" y2="115" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" />
    <!-- Pantograph spark -->
    <circle cx="225" cy="115" r="4" fill="#38bdf8" filter="url(#glow)" />

    <!-- Undercarriage / Bogies & Wheels -->
    <rect x="130" y="280" width="130" height="15" rx="4" fill="#1e293b" />
    <circle cx="155" cy="295" r="16" fill="#334155" stroke="#64748b" stroke-width="4" />
    <circle cx="155" cy="295" r="6" fill="#94a3b8" />
    <circle cx="215" cy="295" r="16" fill="#334155" stroke="#64748b" stroke-width="4" />
    <circle cx="215" cy="295" r="6" fill="#94a3b8" />

    <circle cx="310" cy="295" r="16" fill="#334155" stroke="#64748b" stroke-width="4" />
    <circle cx="310" cy="295" r="6" fill="#94a3b8" />
  </g>

  <!-- Railway Track with perspective -->
  <line x1="60" y1="340" x2="452" y2="340" stroke="#475569" stroke-width="8" stroke-linecap="round" />
  <line x1="40" y1="365" x2="472" y2="365" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />

  <!-- Track Sleepers -->
  <line x1="80" y1="340" x2="65" y2="365" stroke="#334155" stroke-width="6" stroke-linecap="round" />
  <line x1="140" y1="340" x2="130" y2="365" stroke="#334155" stroke-width="6" stroke-linecap="round" />
  <line x1="200" y1="340" x2="195" y2="365" stroke="#334155" stroke-width="6" stroke-linecap="round" />
  <line x1="260" y1="340" x2="260" y2="365" stroke="#334155" stroke-width="6" stroke-linecap="round" />
  <line x1="320" y1="340" x2="325" y2="365" stroke="#334155" stroke-width="6" stroke-linecap="round" />
  <line x1="380" y1="340" x2="390" y2="365" stroke="#334155" stroke-width="6" stroke-linecap="round" />
  <line x1="440" y1="340" x2="455" y2="365" stroke="#334155" stroke-width="6" stroke-linecap="round" />

  <!-- Brand Text 'TRACKNOVA' at bottom -->
  <text x="256" y="440" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="6" 
        text-anchor="middle" 
        fill="#ffffff">
    TRACK<tspan fill="#38bdf8">NOVA</tspan>
  </text>
</svg>

